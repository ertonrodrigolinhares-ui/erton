# Configuração do perfil "jarvis" do Hermes Agent (instalada pelo "Instalar Hermes.bat").
# Os marcadores __ASSIM__ são trocados pelo instalador.

# Cérebro: modelos GRÁTIS do Nous Portal (o login do Nous feito na instalação do Hermes vale
# para este perfil). Se o primeiro estiver fora do ar ou no limite, tenta os de reserva.
# Para trocar: rode "hermes -p jarvis model" e escolha outro da lista (os ":free" são grátis).
model:
  provider: nous
  default: upstage/solar-pro4:free

fallback_providers:
  - provider: nous
    model: stepfun/step-3.7-flash:free
  - provider: nous
    model: meituan/longcat-2.0:free

# Sub-agentes (delegate_task): usam o mesmo cérebro grátis; até 3 trabalhando ao mesmo tempo.
delegation:
  max_concurrent_children: 3
  max_spawn_depth: 1

# Conectores (MCP). Depois de instalar, autorize cada um uma vez:
#   hermes -p jarvis mcp login metricool
#   (anúncios do Meta: veja a observação em mcp_servers)
mcp_servers:
  metricool:
    url: "https://ai.metricool.com/mcp"
    auth: oauth
  # Anúncios do Meta: o MCP oficial (mcp.facebook.com/ads) ainda não aceita login de programas como
  # o Hermes ("Dynamic registration is not available for this client"). Quando o Meta liberar,
  # é só tirar o "#" das 3 linhas abaixo e rodar: hermes -p jarvis mcp login meta_ads
  # meta_ads:
  #   url: "https://mcp.facebook.com/ads"
  #   auth: oauth

# Voz ElevenLabs para as respostas faladas do Hermes (a chave fica no .env).
tts:
  provider: "elevenlabs"
  elevenlabs:
    voice_id: "__VOZ_ELEVENLABS__"
    model_id: "eleven_multilingual_v2"

# Navegador próprio do Jarvis (uma janela visível, para você acompanhar).
browser:
  headed: true

# Comandos perigosos no terminal: pergunta sempre; tarefas agendadas nunca executam.
approvals:
  mode: smart
  cron_mode: deny
  unattended_mode: deny

# Trava de aprovação: publicações e anúncios só com o "ok" do Erton.
hooks:
  pre_tool_call:
    - matcher: "^mcp__(metricool|meta_ads)__"
      command: "__GANCHO__"
      timeout: 10
      fail_closed: true

hooks_auto_accept: true
