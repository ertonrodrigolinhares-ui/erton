# Testes do Jarvis Ultron (o programa do PC) a cada PR. O CI antigo subia Postgres, Redis e o site em
# Next.js do servidor web herdado, que foi para arquivo/servidor-web/ (Etapa 11): todo PR ficava vermelho.
name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes-do-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run: { working-directory: jarvis-ultron }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: jarvis-ultron/requirements.txt }
      - name: Bibliotecas do Linux que o Qt e o áudio precisam (no Windows do Erton já existem)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libportaudio2 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-render-util0 \
            libxcb-image0 libdbus-1-3 libfontconfig1 python3-tk
      - run: pip install -r requirements.txt pytest
      - name: Suíte inteira, só falhas novas contam (tests/dados/falhas_conhecidas.txt)
        run: xvfb-run -a python dev/conferir_testes.py
        env:
          QT_QPA_PLATFORM: offscreen
